<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Đặt hàng | Uyên Ương</title>
  <meta name="robots" content="noindex,follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header><div class="container nav">
  <a class="brand" href="/index.html">
    <img src="/assets/images/logo.jpg" alt="Logo Shop Uyên Ương">
    SHOP UYÊN ƯƠNG
  </a>
  <nav>
    <a href="/index.html#san-pham">Sản phẩm</a>
    <a href="/san-pham/banh-phu-the-hue-tphcm.html">Bánh phu thê</a>
  </nav>
</div></header>
<main class="container section">
  <h1>Đặt hàng</h1>
  <div class="card" style="padding:24px">
    <form id="order-form">
      <div class="form-grid">
        <div><label>Họ và tên</label><input required name="name"></div>
        <div><label>Số điện thoại</label><input required name="phone" inputmode="tel"></div>
        <div>
          <label>Loại bánh</label>
          <select required name="product_type">
            <option value="">-- Chọn loại bánh --</option>
            <option value="Lá dừa">Bánh lá dừa</option>
            <option value="Hộp giấy">Bánh hộp giấy</option>
          </select>
        </div>
        <div><label>Số lượng (số bánh cần đặt)</label><input required type="number" min="1" placeholder="Ví dụ: 65" name="quantity"></div>
        <div><label>Ngày cần nhận bánh</label><input required type="date" name="receive_date"></div>
        <div><label>Địa chỉ nhận bánh</label><input required name="address"></div>
      </div>
      <div style="margin-top:16px"><label>Ghi chú</label><textarea name="note" placeholder="Ví dụ: thời gian giao mong muốn, yêu cầu thêm..."></textarea></div>
      <div class="notice">Sau khi gửi, shop sẽ gọi điện xác nhận đơn hàng và báo giá chính xác trong ít phút.</div>
      <button class="btn" type="submit">Gửi đơn đặt hàng</button>
    </form>
  </div>
</main>
</body></html>
