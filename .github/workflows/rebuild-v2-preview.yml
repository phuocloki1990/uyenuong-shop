name: Rebuild V2 preview

on:
  push:
    branches:
      - v2-preview
    paths:
      - 'v2/content/**'
      - 'v2/assets/**'
      - 'v2/config/**'
      - 'v2/scripts/**'
      - 'assets/images/**'
      - 'infra/**'
      - 'DATA_UI_LOCK_SHA256.txt'
      - '.github/workflows/rebuild-v2-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v2-preview-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4
        with:
          ref: v2-preview
          fetch-depth: 2

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify locked UI implementation
        run: node infra/check-data-ui-lock.mjs --mode=immutable

      - name: Validate V2 content before generating files
        run: node v2/scripts/build.mjs --check

      - name: Build V2 preview and trusted catalog
        run: V2_DEPLOY_TARGET=preview node v2/scripts/build.mjs

      - name: Prepare cutover manifest
        run: node v2/scripts/prepare-cutover.mjs

      - name: Run V1 and V2 tests against generated output
        run: |
          # Includes v2/scripts/publish-hardening.test.mjs and v2/scripts/seo-cutover.test.mjs
          node infra/run-v2-tests.mjs

      - name: Run static Preview QA
        run: node v2/scripts/preview-qa.mjs

      - name: Commit generated preview only
        run: |
          git add -A -- v2-preview functions/_generated/v2-product-catalog.mjs v2/release/cutover-plan.json
          if git diff --cached --quiet; then
            echo "No preview changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build V2 preview"
          git push
