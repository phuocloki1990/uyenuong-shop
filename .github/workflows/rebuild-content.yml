name: Rebuild CMS content

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/**'
      - '.pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build product and article pages
        run: node scripts/build.mjs

      - name: Commit generated pages
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add index.html san-pham cam-nang
          git commit -m "Auto build: update product and article pages"
          git push
