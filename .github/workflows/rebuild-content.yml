name: Rebuild CMS content

on:
  push:
    branches:
      - main
      - admin-products-final
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'functions/api/orders/**'
      - 'assets/js/app.js'
      - '.github/workflows/rebuild-content.yml'
      - '.pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cms-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test CMS builder
        run: node --test scripts/build.test.mjs scripts/order-policy.test.mjs

      - name: Build product and article pages
        run: node scripts/build.mjs
      - name: Verify generated catalog
      run: |
          test -f scripts/generated/product-catalog.mjs
          echo "Product catalog OK"

      - name: Commit generated pages
        run: |
          git add -A -- index.html san-pham cam-nang chuyen-muc sitemap.xml _redirects .cms-build-manifest.json assets/js/cms-catalog.js scripts/generated/product-catalog.mjs
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto build: update product and article pages"
          git push
